<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Minha Casa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
#mapa { width: 100vw; height: 100vh; }

.pin-casa {
  position: relative;
  width: 40px;
  height: 40px;
}
.pin-casa .icone {
  font-size: 32px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
.pin-casa .badge {
  position: absolute;
  top: -5px;
  right: -8px;
  background: #ff4444;
  color: white;
  border-radius: 50%;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: bold;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  animation: pulsar 1.5s infinite;
}
@keyframes pulsar {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.popup-fake {
  font-size: 13px;
  color: #555;
}
.popup-fake h4 {
  margin: 0 0 5px 0;
  font-size: 14px;
  color: #333;
}

#overlay-msg {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.9);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.carta {
  background: linear-gradient(135deg, #f5f5dc 0%, #e8dcc0 100%);
  border-radius: 12px;
  padding: 35px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 50px rgba(212,175,55,0.3);
  animation: surgir 0.5s ease;
}
@keyframes surgir {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.carta h2 {
  color: #5c3a1e;
  font-family: 'Courier New', monospace;
  font-size: 15px;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.carta .remetente {
  color: #8b7355;
  font-size: 12px;
  margin-bottom: 20px;
}
.carta p {
  color: #3d2817;
  font-family: 'Courier New', monospace;
  font-size: 17px;
  line-height: 1.7;
  word-break: break-word;
  margin-bottom: 20px;
  min-height: 30px;
}
.carta .timer {
  color: #8b4513;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  margin-bottom: 20px;
}
.carta .fechar-btn {
  padding: 10px 24px;
  background: transparent;
  border: 2px solid #8b4513;
  color: #8b4513;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  font-weight: bold;
}
.carta .resposta-area {
  margin-top: 20px;
  border-top: 1px solid #c4b090;
  padding-top: 15px;
  text-align: left;
}
.carta .resposta-area h3 {
  color: #5c3a1e;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.carta .resposta-area textarea {
  width: 100%;
  background: rgba(255,255,255,0.5);
  color: #3d2817;
  border: 1px solid #8b4513;
  padding: 10px;
  border-radius: 6px;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  min-height: 60px;
  resize: vertical;
  margin-bottom: 8px;
}
.carta .resposta-area .btn-enviar {
  width: 100%;
  padding: 10px;
  background: #8b4513;
  color: #f5f5dc;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 13px;
}
.carta .enviado {
  color: #228b22;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  margin-top: 8px;
  display: none;
  text-align: center;
}

#input-codigo-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 10000;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.caixa-codigo {
  background: white;
  border-radius: 16px;
  padding: 30px;
  max-width: 320px;
  width: 100%;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.caixa-codigo h3 {
  font-size: 16px;
  color: #333;
  margin-bottom: 5px;
}
.caixa-codigo p {
  font-size: 13px;
  color: #888;
  margin-bottom: 20px;
}
.caixa-codigo input {
  width: 100%;
  padding: 14px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 18px;
  text-align: center;
  letter-spacing: 3px;
  margin-bottom: 15px;
  outline: none;
}
.caixa-codigo input:focus {
  border-color: #007AFF;
}
.caixa-codigo button {
  width: 100%;
  padding: 14px;
  background: #007AFF;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.caixa-codigo .erro-codigo {
  color: #ff4444;
  font-size: 13px;
  margin-top: 10px;
  display: none;
}
</style>
</head>
<body>

<div id="mapa"></div>

<div id="input-codigo-overlay">
  <div class="caixa-codigo">
    <h3>🔐 Caixa Postal Privada</h3>
    <p>Digite o código de acesso para abrir</p>
    <input type="text" id="codigo-input" placeholder="••••" autocomplete="off">
    <button id="btn-abrir">Abrir</button>
    <div class="erro-codigo" id="erro-codigo">Código incorreto</div>
  </div>
</div>

<div id="overlay-msg">
  <div class="carta">
    <h2>📬 Carta Confidencial</h2>
    <div class="remetente">Remetente: Anônimo</div>
    <p id="texto-secreto"></p>
    <div class="timer">Esta carta se autodestruirá em <span id="contador">10</span>s</div>
    <button class="fechar-btn" id="btn-queimar">Queimar carta</button>

    <div class="resposta-area">
      <h3>✍️ Escrever resposta</h3>
      <textarea id="resposta-texto" placeholder="Digite sua resposta aqui..."></textarea>
      <button class="btn-enviar" id="btn-enviar-resposta">Enviar resposta</button>
      <p class="enviado" id="msg-enviado">✅ Resposta enviada!</p>
    </div>
  </div>
</div>

<script>
const CODIGO = "cw";
const TEMPO = 10;
const REPO = "minhasempresasb3/minhasempresasb3.github.io";
const NTFY_TOPICO = "minhasempresasb3-resposta";
const LAT = -19.056974;
const LNG = -41.013636;
let timerAtivo = null;

const mapa = L.map('mapa', { zoomControl: false }).setView([LAT, LNG], 17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(mapa);

const iconeCasa = L.divIcon({
  className: 'pin-casa',
  html: '<div class="pin-casa"><div class="icone">🏠</div><div class="badge">1</div></div>',
  iconSize: [40, 40],
  iconAnchor: [20, 40],
  popupAnchor: [0, -40]
});

const marcador = L.marker([LAT, LNG], { icon: iconeCasa }).addTo(mapa);

marcador.bindPopup();

marcador.on('click', function() {
  document.getElementById('input-codigo-overlay').style.display = 'flex';
  document.getElementById('codigo-input').value = '';
  document.getElementById('codigo-input').focus();
  document.getElementById('erro-codigo').style.display = 'none';
});

function resetarTudo() {
  clearInterval(timerAtivo);
  timerAtivo = null;
  document.getElementById('overlay-msg').style.display = 'none';
  document.getElementById('input-codigo-overlay').style.display = 'none';
  document.getElementById('texto-secreto').textContent = '';
  document.getElementById('contador').textContent = TEMPO;
  document.getElementById('codigo-input').value = '';
  document.getElementById('resposta-texto').value = '';
  document.getElementById('msg-enviado').style.display = 'none';
  document.getElementById('erro-codigo').style.display = 'none';
  mapa.closePopup();
}

async function mostrarMensagem() {
  try {
    const apiUrl = 'https://api.github.com/repos/' + REPO + '/contents/mensagem.txt';
    const r = await fetch(apiUrl + '?ref=main&_=' + Date.now(), {cache: 'no-store'});
    const data = await r.json();
    const msg = atob(data.content).trim();

    if (!msg) {
      resetarTudo();
      return;
    }

    document.getElementById('input-codigo-overlay').style.display = 'none';
    const overlay = document.getElementById('overlay-msg');
    const textoEl = document.getElementById('texto-secreto');
    const contadorEl = document.getElementById('contador');

    textoEl.textContent = msg;
    overlay.style.display = 'flex';

    let segundos = TEMPO;
    contadorEl.textContent = segundos;

    timerAtivo = setInterval(() => {
      segundos--;
      contadorEl.textContent = segundos;
      if (segundos <= 0) resetarTudo();
    }, 1000);

    document.getElementById('btn-queimar').onclick = resetarTudo;

  } catch (e) {
    resetarTudo();
  }
}

function verificarCodigo() {
  const val = document.getElementById('codigo-input').value.trim().toLowerCase();
  if (val === CODIGO) {
    mostrarMensagem();
  } else {
    document.getElementById('erro-codigo').style.display = 'block';
  }
}

async function enviarResposta() {
  const texto = document.getElementById('resposta-texto').value.trim();
  if (!texto) return;
  try {
    await fetch('https://ntfy.sh/' + NTFY_TOPICO, {
      method: 'POST',
      body: texto,
      headers: { 'Title': 'Resposta do Mapa' }
    });
    document.getElementById('msg-enviado').style.display = 'block';
    document.getElementById('resposta-texto').value = '';
  } catch (e) {
    alert('Erro ao enviar.');
  }
}

document.getElementById('btn-abrir').addEventListener('click', verificarCodigo);
document.getElementById('codigo-input').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') verificarCodigo();
});
document.getElementById('btn-enviar-resposta').addEventListener('click', enviarResposta);

document.getElementById('input-codigo-overlay').addEventListener('click', function(e) {
  if (e.target === this) resetarTudo();
});
document.getElementById('overlay-msg').addEventListener('click', function(e) {
  if (e.target === this) resetarTudo();
});
</script>
</body>
</html>
