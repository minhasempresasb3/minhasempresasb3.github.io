<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de moedas hoje</title>
    <meta name="description" content="Dólar, Euro, Real e mais">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #1a1a1a; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        
        /* === FACHADA === */
        .fachada { display: block; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; font-weight: 500; }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #007AFF;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #0056b3; }
        .resultado {
            margin-top: 20px;
            padding: 16px;
            background: #f0f8ff;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
            color: #007AFF;
            display: none;
        }
        
        /* === CAMPO SECRETO === */
        #campo-secreto {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 1px;
            height: 1px;
            opacity: 0;
            border: none;
            background: transparent;
        }
        
        /* === MENSAGEM SECRETA === */
        #overlay-secreto {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .caixa-secreta {
            background: #0a0a0a;
            border: 2px solid #00ff88;
            border-radius: 16px;
            padding: 40px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,255,136,0.2);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0,255,136,0.3); }
            50% { box-shadow: 0 0 60px rgba(0,255,136,0.5); }
        }
        .caixa-secreta h2 {
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .caixa-secreta p {
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            line-height: 1.6;
        }
        .timer {
            margin-top: 20px;
            color: #ff4444;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .fechar-btn {
            margin-top: 30px;
            padding: 10px 30px;
            background: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        .fechar-btn:hover { background: rgba(0,255,136,0.1); }
        
        /* === ERRO (código errado) === */
        #overlay-erro {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            z-index: 9998;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .erro-box {
            text-align: center;
        }
        .erro-box h2 { color: #999; font-size: 48px; margin-bottom: 10px; }
        .erro-box p { color: #666; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversor de moedas hoje</h1>
        <p class="subtitle">Dólar, Euro, Real e mais</p>
        
        <div class="fachada">
            <div class="input-group">
                <label>Valor</label>
                <input type="text" placeholder="Digite um valor..." id="fake-input">
            </div>
            <div class="input-group">
                <label>Converter para</label>
                <select id="fake-select">
                    <option>Celsius → Fahrenheit</option>
                    <option>Fahrenheit → Celsius</option>
                    <option>Celsius → Kelvin</option>
                </select>
            </div>
            <button class="btn" onclick="fakeCalc()">Converter</button>
            <div class="resultado" id="fake-result">Resultado: 32°F</div>
        </div>
    </div>
    
    <!-- Campo secreto invisível -->
    <input type="text" id="campo-secreto" placeholder="Código" autocomplete="off">
    
    <!-- Overlay da mensagem secreta -->
    <div id="overlay-secreto">
        <div class="caixa-secreta">
            <h2>🔓 MENSAGEM DESBLOQUEADA</h2>
            <p id="texto-secreto">eu e voce</p>
            <div class="timer" id="timer">Esta mensagem será destruída em <span id="contador">20</span>s</div>
            <button class="fechar-btn" onclick="destruir()">Destruir agora</button>
        </div>
    </div>
    
    <!-- Overlay de erro (código errado) -->
    <div id="overlay-erro">
        <div class="erro-box">
            <h2>404</h2>
            <p>Página não encontrada</p>
        </div>
    </div>

    <script>
        const CODIGO_SECRETO = "cw26";
        const TEMPO_DESTRUICAO = 20;
        
        // Focar no campo secreto quando pressionar Ctrl+Shift+K
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'K') {
                e.preventDefault();
                document.getElementById('campo-secreto').focus();
            }
        });
        
        // Detectar digitação no campo secreto
        const campoSecreto = document.getElementById('campo-secreto');
        campoSecreto.addEventListener('input', function(e) {
            const digitado = e.target.value.trim();
            if (digitado === CODIGO_SECRETO) {
                revelarMensagem();
                e.target.value = '';
            } else if (digitado.length >= CODIGO_SECRETO.length) {
                mostrarErro();
                e.target.value = '';
            }
        });
        
        // Também detectar Enter no campo fake (alguns vão tentar digitar lá)
        document.getElementById('fake-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                if (val === CODIGO_SECRETO) {
                    revelarMensagem();
                    e.target.value = '';
                }
            }
        });
        
        function revelarMensagem() {
            document.getElementById('overlay-secreto').style.display = 'flex';
            let segundos = TEMPO_DESTRUICAO;
            const contador = document.getElementById('contador');
            const intervalo = setInterval(() => {
                segundos--;
                contador.textContent = segundos;
                if (segundos <= 0) {
                    clearInterval(intervalo);
                    destruir();
                }
            }, 1000);
        }
        
        function mostrarErro() {
            document.getElementById('overlay-erro').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('overlay-erro').style.display = 'none';
            }, 2000);
        }
        
        function destruir() {
            document.getElementById('overlay-secreto').style.display = 'none';
            document.getElementById('texto-secreto').textContent = '[MENSAGEM DESTRUÍDA]';
        }
        
        function fakeCalc() {
            document.getElementById('fake-result').style.display = 'block';
            document.getElementById('fake-result').textContent = 'Resultado: ' + (Math.random() * 100).toFixed(1) + '°';
        }
    </script>
</body>
</html>
